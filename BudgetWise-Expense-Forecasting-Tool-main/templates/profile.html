<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetWise — Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>

    <!-- ══ HEADER ═════════════════════════════════════════════ -->
    <header class="header">
        <div class="header-left">
            <div class="logo-stamp">
                BudgetWise
                <span class="logo-tagline">AI-powered expense forecasting</span>
            </div>
            <a href="/dashboard" class="dashboard-btn">← Dashboard</a>
        </div>
        <div class="header-right">
            <span class="welcome-text">Profile</span>
            <a href="/logout" class="logout-btn">Sign out</a>
        </div>
    </header>

    <!-- ══ MAIN CONTENT ═══════════════════════════════════════ -->
    <main class="main-container">

        <!-- Hero banner -->
        <section class="welcome-section">
            <h2>Your Profile</h2>
            <p>Manage your account details and preferences.</p>
        </section>

        <!-- Profile card -->
        <section class="overview-section" style="max-width:680px; margin:0 auto;">
            <h3>Account Information</h3>

            <div style="display:flex; flex-direction:column; gap:1.5rem; padding:0.5rem 0;">

                <!-- Avatar & name row -->
                <div style="display:flex; align-items:center; gap:1.5rem; padding:1.5rem; background:var(--bg); border-radius:var(--r-lg); border:1px solid var(--border);">
                    <div style="
                        width:72px; height:72px; border-radius:50%;
                        background:linear-gradient(135deg, var(--navy), var(--teal-dark));
                        display:flex; align-items:center; justify-content:center;
                        font-family:'Syne',sans-serif; font-size:1.8rem; font-weight:800;
                        color:#fff; flex-shrink:0;
                        box-shadow:0 4px 14px rgba(4,54,74,0.25);
                    ">
                        {{ user[0]|upper if user else '?' }}
                    </div>
                    <div>
                        <p style="font-family:'Syne',sans-serif; font-size:1.4rem; font-weight:800; color:var(--navy); letter-spacing:-0.02em; margin-bottom:0.2rem;">
                            {{ user }}
                        </p>
                        <p style="font-size:0.82rem; color:var(--text-3); font-weight:500; text-transform:uppercase; letter-spacing:0.08em;">
                            BudgetWise Member
                        </p>
                    </div>
                </div>

                <!-- Detail rows -->
                <div style="display:grid; gap:1rem;">

                    <div class="form-group" style="margin-bottom:0;">
                        <label>Full Name</label>
                        <div style="padding:0.8rem 1rem; background:var(--surface-2); border:1.5px solid var(--border); border-radius:var(--r-sm); font-size:0.95rem; font-weight:500; color:var(--text);">
                            {{ user }}
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom:0;">
                        <label>Email Address</label>
                        <div style="padding:0.8rem 1rem; background:var(--surface-2); border:1.5px solid var(--border); border-radius:var(--r-sm); font-size:0.95rem; font-weight:500; color:var(--text);">
                            {{ email }}
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom:0;">
                        <label>Account Status</label>
                        <div style="padding:0.8rem 1rem; background:var(--surface-2); border:1.5px solid rgba(5,150,105,0.25); border-radius:var(--r-sm); font-size:0.9rem; font-weight:600; color:var(--success); display:flex; align-items:center; gap:0.5rem;">
                            <span style="width:8px; height:8px; background:var(--success); border-radius:50%; display:inline-block;"></span>
                            Active
                        </div>
                    </div>

                </div>

                <!-- Actions -->
                <div style="display:flex; gap:1rem; flex-wrap:wrap; margin-top:0.5rem;">
                    <button class="action-btn-base" onclick="window.location.href='/dashboard'"
                            style="flex:1; min-width:160px;">
                        ← Back to Dashboard
                    </button>
                    <button class="action-btn-base" onclick="window.location.href='/settings'"
                            style="flex:1; min-width:160px; background:linear-gradient(135deg,#64748B,#94A3B8);">
                        ⚙️ Settings
                    </button>
                </div>

            </div>
        </section>

    </main>

</body>
</html>
