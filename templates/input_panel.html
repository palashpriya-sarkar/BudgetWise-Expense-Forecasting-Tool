<!-- INPUT PANEL HTML - ADD THIS TO YOUR dashboard.html FILE -->

<!-- Add this BEFORE the closing </body> tag -->

<!-- INPUT PANEL (SIDEBAR) -->
<div class="input-panel" id="inputPanel">
    <div class="input-panel-header">
        <h3>Add Expense</h3>
        <button class="input-panel-close" onclick="closeInputPanel()">✕</button>
    </div>
    
    <form id="inputForm" class="input-form">
        <div class="input-form-group">
            <label class="input-form-label">Category</label>
            <select class="input-form-input input-form-select" id="expenseCategory" required>
                <option value="" disabled selected>Select category</option>
                <option value="Food">Food &amp; Dining</option>
                <option value="Transport">Transportation</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Bills">Bills &amp; Utilities</option>
                <option value="Health">Healthcare</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>
        </div>
        
        <div class="input-form-group">
            <label class="input-form-label">Amount</label>
            <input type="number" class="input-form-input" id="expenseAmount" placeholder="0.00" step="0.01" min="0" required>
        </div>
        
        <div class="input-form-group">
            <label class="input-form-label">Date</label>
            <input type="date" class="input-form-input" id="expenseDate" required>
        </div>
        
        <div class="input-form-group">
            <label class="input-form-label">Description (Optional)</label>
            <textarea class="input-form-input input-form-textarea" id="expenseDescription" placeholder="Add details about this expense..."></textarea>
        </div>
        
        <div class="input-form-buttons">
            <button type="button" class="input-form-btn input-form-btn-cancel" onclick="closeInputPanel()">Cancel</button>
            <button type="submit" class="input-form-btn input-form-btn-submit">✓ Add Expense</button>
        </div>
    </form>
</div>

<!-- FLOATING TOGGLE BUTTON (shows on mobile) -->
<button class="input-toggle-btn" id="inputToggleBtn" onclick="openInputPanel()">+</button>
