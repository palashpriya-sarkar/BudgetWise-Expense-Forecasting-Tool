<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - BudgetWise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <h1 class="logo">BudgetWise</h1>
            <a href="/dashboard" class="dashboard-btn" style="background: #5068af;">← Dashboard</a>
        </div>
        <div class="header-right">
            <span class="welcome-text">Profile</span>
        </div>
    </header>

    <main class="main-container">
        <section class="overview-section" style="max-width: 800px; margin: 2rem auto;">
            <h3>User Profile</h3>
            <div style="padding: 2rem; text-align: left;">
                <div class="form-group">
                    <label style="font-size: 1.1rem; color: #6b7280;">Name</label>
                    <p style="font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-top: 0.5rem;">{{ user }}</p>
                </div>
                <div class="form-group" style="margin-top: 2rem;">
                    <label style="font-size: 1.1rem; color: #6b7280;">Email</label>
                    <p style="font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-top: 0.5rem;">{{ email }}</p>
                </div>
                <div class="form-group" style="margin-top: 2rem;">
                    <label style="font-size: 1.1rem; color: #6b7280;">Account Status</label>
                    <p style="font-size: 1.3rem; font-weight: 600; color: #10b981; margin-top: 0.5rem;">✓ Active</p>
                </div>
                <div style="margin-top: 3rem; text-align: center;">
                    <button class="action-btn-base" onclick="window.location.href='/dashboard'">Back to Dashboard</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
